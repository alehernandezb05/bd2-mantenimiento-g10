# Cluster Citus 12.1 (PostgreSQL 16) - Grupo 10 Mantenimiento
# 1 coordinador + 3 workers (ESTE, CENTRAL, OESTE)

networks:
  red-citus:
    driver: bridge

volumes:
  datos_coordinador:
  datos_worker_1:
  datos_worker_2:
  datos_worker_3:

x-nodo-citus: &nodo-citus
  image: citusdata/citus:12.1
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: aa_mantenimiento
    POSTGRES_HOST_AUTH_METHOD: trust
  networks:
    - red-citus

services:
  coordinator:
    <<: *nodo-citus
    container_name: citus_coordinator
    ports:
      - "5432:5432"
    volumes:
      - datos_coordinador:/var/lib/postgresql/data
      - ./docker/citus-init:/docker-entrypoint-initdb.d

  worker1:
    <<: *nodo-citus
    container_name: citus_worker_1
    volumes:
      - datos_worker_1:/var/lib/postgresql/data
      - ./docker/citus-init:/docker-entrypoint-initdb.d

  worker2:
    <<: *nodo-citus
    container_name: citus_worker_2
    volumes:
      - datos_worker_2:/var/lib/postgresql/data
      - ./docker/citus-init:/docker-entrypoint-initdb.d

  worker3:
    <<: *nodo-citus
    container_name: citus_worker_3
    volumes:
      - datos_worker_3:/var/lib/postgresql/data
      - ./docker/citus-init:/docker-entrypoint-initdb.d
